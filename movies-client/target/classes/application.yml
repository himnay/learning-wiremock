server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

spring:
  application:
    name: learning-wiremock
  lifecycle:
    timeout-per-shutdown-phase: 30s

movies:
  client:
    base-url: ${MOVIES_SERVICE_URL:http://localhost:8081}
    connect-timeout-ms: 5000
    response-timeout-seconds: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
    info:
      enabled: true
  info:
    git:
      mode: full
    build:
      enabled: true
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,300ms,500ms,1s,2s

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.learnwiremock: DEBUG

app:
  metadata:
    project-name: Learning WireMock
    description: Learning WireMock with Spring Boot — stubs, response templates, fault simulation
    version: 1.0.0-SNAPSHOT
