services:

  # ── Movies REST Service (pre-built JAR, Java 11+) ───────────────────────────
  movies-service:
    image: eclipse-temurin:21-jre-alpine
    container_name: movies-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./movies-restful-service/movies-restful-service-beyond-java8.jar:/app/movies-service.jar:ro
    command: ["java", "-jar", "/app/movies-service.jar"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/movieservice/v1/allMovies || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Observability ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: wiremock-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: wiremock-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  grafana-data:
